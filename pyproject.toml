[project]
name = "teach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.30.0",
    "nltk>=3.10.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The worker loop lives in the verified-sandbox package (`uv tool install
# --editable`), not in this repo and not in its dependency graph -- it is a tool
# the repo is driven by, not a library the repo uses. Only what genuinely
# differs per repo belongs here; see that package's README for every key.
[tool.sandbox]
# Nothing is parked. teach-8xw.17 was parked here for wanting a real
# HuggingFace credential no worker session had; it was verified live from a
# human-run session on 2026-09-09 (and found two bugs no dry run could reach),
# so it is closed and unparked. Park a bead when the blocker is the sandbox's,
# not the bead's -- a missing credential, a service only the host can reach --
# never to route around one a worker simply found hard.

# narrator is a sibling repo on the host, not a package on any index. Two
# worker sessions burned searching GitHub/PyPI for it before it was mounted.
# Read-only: workers read its story-generation machinery, never edit it.
volumes = ["/Users/benjaminhess/Downloads/narrator:/workspace-narrator:ro",
           "/Users/benjaminhess/Downloads/mathgraph:/workspace-mathgraph:ro"]

[tool.sandbox.forward-env]
HF_TOKEN = "publishing built knowledge graphs to HuggingFace will fail"
